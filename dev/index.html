<!DOCTYPE html>
<html lang="en-GB" class="theme-cream">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A calm, dyslexia-friendly typing tutor for young learners. Runs entirely in your browser.">
    <meta name="theme-color" content="#f6f2e8">
    <title>StoryKeys</title>
    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link href="https://fonts.cdnfonts.com/css/opendyslexic" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body class="m-0 p-3 sm:p-5 flex justify-center items-start min-h-screen bg-sk-bg text-sk-text">

    <div id="loading-overlay">
        <div class="text-5xl animate-pulse" aria-hidden="true">📖</div>
        <p class="m-0">Loading StoryKeys…</p>
        <p id="loading-error" class="hidden text-base font-normal text-center max-w-[32ch]"></p>
    </div>

    <div id="app-container" class="hidden w-full max-w-[820px] relative flex flex-col gap-5">
        <header class="flex justify-between items-center gap-3 flex-wrap">
            <button id="about-btn" class="inline-flex items-center gap-2 text-xl sm:text-2xl font-extrabold border-0 bg-transparent text-inherit cursor-pointer py-2 px-2.5 -ml-1 rounded-xl hover:bg-sk-subtle transition-colors duration-150 focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-sk-accent" type="button" aria-label="Go to home screen" title="Home">
                <span id="progress-pet" class="text-2xl" aria-hidden="true"></span>
                <span>StoryKeys</span>
            </button>
            <nav class="flex items-center gap-1.5 sm:gap-2" aria-label="Main">
                <button id="start-here-btn" class="inline-flex items-center justify-center min-h-11 text-sm sm:text-base font-semibold px-4 rounded-xl border-2 bg-sk-subtle border-sk-border text-sk-text cursor-pointer hover:border-sk-accent transition-colors duration-150 focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-sk-accent" type="button">Start here</button>
                <button id="help-btn" class="bg-transparent border-0 cursor-pointer size-11 rounded-full inline-flex items-center justify-center text-sk-muted hover:bg-sk-subtle hover:text-sk-text transition-colors duration-150 focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-sk-accent" title="Help" aria-label="Help"><svg class="w-6 h-6 fill-current" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 17c-.83 0-1.5-.67-1.5-1.5S11.17 16 12 16s1.5.67 1.5 1.5S12.83 19 12 19zm1.4-5.75c-.63.46-1.02.86-1.02 1.75h-1.5c0-1.16.56-1.87 1.25-2.38.62-.45 1.02-.83 1.02-1.62 0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5H7.75c0-1.93 1.57-3.5 3.5-3.5s3.5 1.57 3.5 3.5c0 1.26-.64 2.02-1.35 2.75z"></path></svg></button>
                <button id="settings-btn" class="bg-transparent border-0 cursor-pointer size-11 rounded-full inline-flex items-center justify-center text-sk-muted hover:bg-sk-subtle hover:text-sk-text transition-colors duration-150 focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-sk-accent" title="Settings" aria-label="Settings"><svg class="w-6 h-6 fill-current" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65a.49.49 0 0 0-.49-.42h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.6.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.65.07.97L2.48 14.6a.5.5 0 0 0-.12.64l2 3.46c.14.24.42.32.6.22l2.49-1c.52.4 1.09.73 1.69.98l.38 2.65c.04.24.25.42.49.42h4c.24 0 .45-.18.49-.42l.38-2.65c.6-.25 1.17-.58 1.69-.98l2.49 1c.18.1.46.02.6-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65z"></path></svg></button>
                <button id="parent-btn" class="bg-transparent border-0 cursor-pointer size-11 rounded-full inline-flex items-center justify-center text-sk-muted hover:bg-sk-subtle hover:text-sk-text transition-colors duration-150 focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-sk-accent" title="Parent Glance" aria-label="Parent Glance"><svg class="w-6 h-6 fill-current" viewBox="0 0 24 24" aria-hidden="true"><path d="M12,12c2.21,0,4-1.79,4-4s-1.79-4-4-4S8,5.79,8,8S9.79,12,12,12z M12,14c-2.67,0-8,1.34-8,4v2h16v-2 C20,15.34,14.67,14,12,14z"></path></svg></button>
            </nav>
        </header>

        <main id="main-content"></main>

        <footer class="border-t border-sk-border pt-4 pb-2 text-center text-[0.9rem] text-sk-muted flex flex-col gap-1" role="contentinfo">
            <span>StoryKeys runs entirely in your browser. Your progress never leaves this device.</span>
            <button id="footer-privacy-link" class="bg-transparent border-0 text-sk-accent cursor-pointer font-semibold p-0 underline hover:opacity-80 focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-sk-accent" type="button" aria-label="Open privacy details">Privacy</button>
        </footer>

        <div id="modal-container"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
