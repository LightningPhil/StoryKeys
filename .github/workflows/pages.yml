name: Build GitHub Pages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require compiled site in the pull request
        if: github.event_name == 'pull_request'
        run: |
          git add index.html audit.html assets .nojekyll audit data
          if ! git diff --staged --quiet; then
            echo "The compiled GitHub Pages files are missing or stale."
            echo "Run npm run build and commit index.html, audit.html, assets/, audit/, data/ and .nojekyll."
            git diff --staged --stat
            exit 1
          fi
      - name: Commit compiled site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html audit.html assets .nojekyll audit data
          git diff --staged --quiet || git commit -m "Rebuild compiled GitHub Pages site [skip ci]"
          git push
